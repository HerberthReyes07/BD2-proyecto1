# Punto de entrada DISTRIBUIDO: cada quien corre este mismo archivo con
# SU PROPIO .env, apuntando a las IPs reales de Tailscale.
#
# Nodos 1-3 (base de datos y proxy):
#   docker compose --profile nodo-bd up -d --build
# Solo Proxy (para levantar o reiniciar el proxy por separado):
#   docker compose --profile proxy up -d --build
# Nodo 4 (monitoreo, cuando C tenga su parte lista):
#   docker compose --profile monitoreo up -d --build

services:
  etcd:
    build:
      context: ./base
      dockerfile: Dockerfile.etcd
    profiles: ["nodo-bd"]
    environment:
      - ETCD_NAME=${NODE_NAME}
      - ETCD_DATA_DIR=/etcd-data
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://${MY_TAILSCALE_IP}:2380
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://${MY_TAILSCALE_IP}:2379
      - ETCD_INITIAL_CLUSTER=nodo1=http://${IP_NODO1}:2380,nodo2=http://${IP_NODO2}:2380,nodo3=http://${IP_NODO3}:2380
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_INITIAL_CLUSTER_TOKEN=bd2-grupo5
    restart: unless-stopped
    network_mode: host
    volumes:
      - etcd_data:/etcd-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2379/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  patroni:
    build:
      context: ./base
      dockerfile: Dockerfile
    profiles: ["nodo-bd"]
    depends_on:
      etcd:
        condition: service_healthy
    restart: unless-stopped
    network_mode: host
    environment:
      - PATRONI_NAME=${NODE_NAME}
      - PATRONI_SCOPE=bd2-grupo5
      - PATRONI_RESTAPI_LISTEN=0.0.0.0:8008
      - PATRONI_RESTAPI_CONNECT_ADDRESS=${MY_TAILSCALE_IP}:8008
      - PATRONI_ETCD3_HOSTS=${IP_NODO1}:2379,${IP_NODO2}:2379,${IP_NODO3}:2379
      - PATRONI_POSTGRESQL_LISTEN=0.0.0.0:5432
      - PATRONI_POSTGRESQL_CONNECT_ADDRESS=${MY_TAILSCALE_IP}:5432
      - PATRONI_POSTGRESQL_DATA_DIR=/data/postgres
      - PATRONI_REPLICATION_USERNAME=replicator
      - PATRONI_REPLICATION_PASSWORD=${REPLICATION_PASSWORD}
      - PATRONI_SUPERUSER_USERNAME=postgres
      - PATRONI_SUPERUSER_PASSWORD=${SUPERUSER_PASSWORD}
      - NOFAILOVER=${NOFAILOVER}
      - NOSYNC=${NOSYNC}
    volumes:
      - pgdata:/data/postgres

  # --- Capa de Proxy y Alta Disponibilidad (HAProxy + keepalived) ---
  haproxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    profiles: ["nodo-bd", "proxy"]
    restart: unless-stopped
    network_mode: host
    environment:
      - NODE_NAME=${NODE_NAME}
      - MY_TAILSCALE_IP=${MY_TAILSCALE_IP}
      - IP_NODO1=${IP_NODO1}
      - IP_NODO2=${IP_NODO2}
      - IP_NODO3=${IP_NODO3}

  keepalived:
    build:
      context: ./proxy
      dockerfile: Dockerfile.keepalived
    profiles: ["nodo-bd", "proxy"]
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
    environment:
      - NODE_NAME=${NODE_NAME}
      - MY_TAILSCALE_IP=${MY_TAILSCALE_IP}
      - IP_NODO1=${IP_NODO1}
      - IP_NODO2=${IP_NODO2}
      - IP_NODO3=${IP_NODO3}
      - KEEPALIVED_PRIORITY=${KEEPALIVED_PRIORITY:-}
      - KEEPALIVED_STATE=${KEEPALIVED_STATE:-}
      - KEEPALIVED_INTERFACE=${KEEPALIVED_INTERFACE:-tailscale0}
      - VIRTUAL_IP=${VIRTUAL_IP:-100.124.30.200}

  # ============================================================
  # CAPA C — Observabilidad y carga (la lleva nodo3, que hace de "nodo 4")
  # ============================================================

  # --- Agentes de metricas: van en LOS TRES nodos de BD ---
  # Comparten el perfil "nodo-bd" para que suban junto con el cluster y no haya
  # que correr un segundo compose. Tienen ademas perfil propio por si hace falta
  # reiniciarlos solos sin tocar la base de datos.
  #
  # Patroni ya expone sus propias metricas en :8008/metrics de forma nativa
  # (rol, estado, timeline y posiciones de WAL), por eso aqui solo hacen falta
  # las del sistema operativo y las de Postgres.
  node-exporter:
    image: prom/node-exporter:v1.8.2
    profiles: ["nodo-bd", "monitoreo-agente"]
    restart: unless-stopped
    network_mode: host
    pid: host
    command:
      - '--path.procfs=/host/proc'
      - '--path.sysfs=/host/sys'
      - '--path.rootfs=/host/root'
      - '--collector.filesystem.mount-points-exclude=^/(sys|proc|dev|host|etc)($$|/)'
      - '--web.listen-address=0.0.0.0:9100'
    volumes:
      - /proc:/host/proc:ro
      - /sys:/host/sys:ro
      - /:/host/root:ro,rslave

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.16.0
    profiles: ["nodo-bd", "monitoreo-agente"]
    restart: unless-stopped
    network_mode: host
    environment:
      # Apunta al Postgres LOCAL de este nodo, no al proxy: cada nodo debe
      # reportar su propio estado. Si Patroni tiene su Postgres abajo, publica
      # pg_up=0, que es justo la senal de "servicio de BD caido" de la Fase 7.
      - DATA_SOURCE_NAME=postgresql://postgres:${SUPERUSER_PASSWORD}@127.0.0.1:5432/postgres?sslmode=disable
      - PG_EXPORTER_WEB_LISTEN_ADDRESS=0.0.0.0:9187

  # --- Stack de observabilidad: SOLO lo levanta nodo3, con --profile monitoreo ---
  # Es un unico punto de recoleccion para los tres nodos. Vive en nodo3 porque
  # es el unico que sobrevive a todos los escenarios de falla de las Fases 3-5:
  # si estuviera en nodo1 se apagaria justo cuando hay que observar.
  prometheus:
    image: prom/prometheus:v3.1.0
    profiles: ["monitoreo"]
    restart: unless-stopped
    network_mode: host
    user: root
    # El entrypoint genera prometheus.yml desde estas variables, para que la
    # misma configuracion sirva aqui y en la simulacion local.
    entrypoint: ["/bin/sh", "/etc/prometheus/entrypoint.sh"]
    environment:
      - PATRONI_NODO1=${IP_NODO1}:8008
      - PATRONI_NODO2=${IP_NODO2}:8008
      - PATRONI_NODO3=${IP_NODO3}:8008
      - NODEEXP_NODO1=${IP_NODO1}:9100
      - NODEEXP_NODO2=${IP_NODO2}:9100
      - NODEEXP_NODO3=${IP_NODO3}:9100
      - PGEXP_NODO1=${IP_NODO1}:9187
      - PGEXP_NODO2=${IP_NODO2}:9187
      - PGEXP_NODO3=${IP_NODO3}:9187
    volumes:
      - ./monitoreo/prometheus/entrypoint.sh:/etc/prometheus/entrypoint.sh:ro
      - prometheus_data:/prometheus

  grafana:
    image: grafana/grafana:11.5.2
    profiles: ["monitoreo"]
    restart: unless-stopped
    network_mode: host
    depends_on: [prometheus]
    environment:
      - GF_SECURITY_ADMIN_USER=${GRAFANA_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GRAFANA_PASSWORD:-admin}
      - GF_USERS_ALLOW_SIGN_UP=false
      - GF_DASHBOARDS_MIN_REFRESH_INTERVAL=5s
      - PROMETHEUS_URL=http://127.0.0.1:9090
    volumes:
      # Dashboards aprovisionados desde archivos versionados en git: si se borra
      # el contenedor no se pierde nada y quedan como evidencia reproducible.
      - ./monitoreo/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./monitoreo/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana

volumes:
  etcd_data:
  pgdata:
  prometheus_data:
  grafana_data: