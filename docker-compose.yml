# Punto de entrada DISTRIBUIDO: cada quien corre este mismo archivo con
# SU PROPIO .env, apuntando a las IPs reales de Tailscale.
#
# Nodos 1-3 (base de datos y proxy):
#   docker compose --profile nodo-bd up -d --build
# Solo Proxy (para levantar o reiniciar el proxy por separado):
#   docker compose --profile proxy up -d --build
# Nodo 4 (monitoreo, cuando C tenga su parte lista):
#   docker compose --profile monitoreo up -d --build

services:
  etcd:
    build:
      context: ./base
      dockerfile: Dockerfile.etcd
    profiles: ["nodo-bd"]
    environment:
      - ETCD_NAME=${NODE_NAME}
      - ETCD_DATA_DIR=/etcd-data
      - ETCD_INITIAL_ADVERTISE_PEER_URLS=http://${MY_TAILSCALE_IP}:2380
      - ETCD_LISTEN_PEER_URLS=http://0.0.0.0:2380
      - ETCD_LISTEN_CLIENT_URLS=http://0.0.0.0:2379
      - ETCD_ADVERTISE_CLIENT_URLS=http://${MY_TAILSCALE_IP}:2379
      - ETCD_INITIAL_CLUSTER=nodo1=http://${IP_NODO1}:2380,nodo2=http://${IP_NODO2}:2380,nodo3=http://${IP_NODO3}:2380
      - ETCD_INITIAL_CLUSTER_STATE=new
      - ETCD_INITIAL_CLUSTER_TOKEN=bd2-grupo5
    restart: unless-stopped
    network_mode: host
    volumes:
      - etcd_data:/etcd-data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:2379/health"]
      interval: 10s
      timeout: 3s
      retries: 5
      start_period: 10s

  patroni:
    build:
      context: ./base
      dockerfile: Dockerfile
    profiles: ["nodo-bd"]
    depends_on:
      etcd:
        condition: service_healthy
    restart: unless-stopped
    network_mode: host
    environment:
      - PATRONI_NAME=${NODE_NAME}
      - PATRONI_SCOPE=bd2-grupo5
      - PATRONI_RESTAPI_LISTEN=0.0.0.0:8008
      - PATRONI_RESTAPI_CONNECT_ADDRESS=${MY_TAILSCALE_IP}:8008
      - PATRONI_ETCD3_HOSTS=${IP_NODO1}:2379,${IP_NODO2}:2379,${IP_NODO3}:2379
      - PATRONI_POSTGRESQL_LISTEN=0.0.0.0:5432
      - PATRONI_POSTGRESQL_CONNECT_ADDRESS=${MY_TAILSCALE_IP}:5432
      - PATRONI_POSTGRESQL_DATA_DIR=/data/postgres
      - PATRONI_REPLICATION_USERNAME=replicator
      - PATRONI_REPLICATION_PASSWORD=${REPLICATION_PASSWORD}
      - PATRONI_SUPERUSER_USERNAME=postgres
      - PATRONI_SUPERUSER_PASSWORD=${SUPERUSER_PASSWORD}
      - NOFAILOVER=${NOFAILOVER}
      - NOSYNC=${NOSYNC}
    volumes:
      - pgdata:/data/postgres

  # --- Capa de Proxy y Alta Disponibilidad (HAProxy + keepalived) ---
  haproxy:
    build:
      context: ./proxy
      dockerfile: Dockerfile
    profiles: ["nodo-bd", "proxy"]
    restart: unless-stopped
    network_mode: host
    environment:
      - NODE_NAME=${NODE_NAME}
      - MY_TAILSCALE_IP=${MY_TAILSCALE_IP}
      - IP_NODO1=${IP_NODO1}
      - IP_NODO2=${IP_NODO2}
      - IP_NODO3=${IP_NODO3}

  keepalived:
    build:
      context: ./proxy
      dockerfile: Dockerfile.keepalived
    profiles: ["nodo-bd", "proxy"]
    restart: unless-stopped
    network_mode: host
    cap_add:
      - NET_ADMIN
      - NET_BROADCAST
      - NET_RAW
    environment:
      - NODE_NAME=${NODE_NAME}
      - MY_TAILSCALE_IP=${MY_TAILSCALE_IP}
      - IP_NODO1=${IP_NODO1}
      - IP_NODO2=${IP_NODO2}
      - IP_NODO3=${IP_NODO3}
      - KEEPALIVED_PRIORITY=${KEEPALIVED_PRIORITY:-}
      - KEEPALIVED_STATE=${KEEPALIVED_STATE:-}
      - KEEPALIVED_INTERFACE=${KEEPALIVED_INTERFACE:-tailscale0}
      - VIRTUAL_IP=${VIRTUAL_IP:-100.124.30.200}

  # --- Se activa con --profile monitoreo, cuando C tenga su parte lista ---
  # prometheus:
  #   build: { context: ./monitoreo, dockerfile: Dockerfile }
  #   profiles: ["monitoreo"]
  #   ...

volumes:
  etcd_data:
  pgdata: